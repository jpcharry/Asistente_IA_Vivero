name: Revision automatizada de calidad y seguridad

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias y herramientas
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff pip-audit

      - name: Revisar estilo y seguridad con Ruff
        run: python -m ruff check .

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Auditar dependencias
        run: python -m pip_audit -r requirements.txt
